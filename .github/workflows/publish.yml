name: Publish to npm

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'projects/valence-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build valence-ui library
        run: npm run build:lib

      - name: Check if version already exists on npm
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./projects/valence-ui/package.json').version")
          PACKAGE_NAME=$(node -p "require('./projects/valence-ui/package.json').name")
          echo "Package: $PACKAGE_NAME"
          echo "Current local version: $CURRENT_VERSION"
          
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version --silent > /dev/null 2>&1; then
            echo "Version $CURRENT_VERSION already exists on npm. Skipping publication."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION is new. Ready to publish!"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm publish dist/valence-ui --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
