<div class="val-tabs">
  <div class="val-tabs__header-container">
    @if (showLeftArrow()) {
    <button
      class="val-tabs__nav val-tabs__nav--prev"
      (click)="scrollHeader('left')"
      aria-label="Previous tabs"
    >
      <val-icon name="chevron-left" size="1rem"></val-icon>
    </button>
    }

    <div
      class="val-tabs__header"
      role="tablist"
      #headerContainer
      (scroll)="onScroll()"
      (keydown)="onKeyDown($event)"
    >
      @for (tab of tabs(); track tab; let i = $index) {
      <button
        #tabButton
        class="val-tabs__tab-label"
        [class.val-tabs__tab-label--active]="i === activeIndex()"
        [class.val-tabs__tab-label--disabled]="tab.disabled()"
        (click)="selectTab(i)"
        role="tab"
        [id]="tab.id() + '-label'"
        [attr.aria-selected]="i === activeIndex()"
        [attr.aria-controls]="tab.id() + '-panel'"
        [attr.tabindex]="i === activeIndex() ? 0 : -1"
        [disabled]="tab.disabled()"
      >
        @if (tab.headerTemplate()) {
        <ng-container
          *ngTemplateOutlet="tab.headerTemplate()!.templateRef"
        ></ng-container>
        } @else {
          @if (tab.icon()) {
            <val-icon [name]="$any(tab.icon()!)" size="1rem" style="margin-right: 0.375rem; vertical-align: middle;"></val-icon>
          }
          <span>{{ tab.label() }}</span>
        }
      </button>
      }
      <div
        class="val-tabs__indicator"
        [style.left.px]="indicatorLeft()"
        [style.width.px]="indicatorWidth()"
        aria-hidden="true"
      ></div>
    </div>

    @if (showRightArrow()) {
    <button
      class="val-tabs__nav val-tabs__nav--next"
      (click)="scrollHeader('right')"
      aria-label="Next tabs"
    >
      <val-icon name="chevron-right" size="1rem"></val-icon>
    </button>
    }
  </div>

  <div
    class="val-tabs__content"
    role="tabpanel"
    [id]="(activeTab()?.id() ?? '') + '-panel'"
    [attr.aria-labelledby]="(activeTab()?.id() ?? '') + '-label'"
    tabindex="0"
  >
    @if (activeTab()) {
    <ng-container *ngTemplateOutlet="activeTab()!.content()"></ng-container>
    }
  </div>
</div>
