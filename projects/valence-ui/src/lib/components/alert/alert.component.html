<div class="val-alert__container">
  @if (showIcon()) {
    <div class="val-alert__icon-container">
      <val-icon [name]="effectiveIcon()" size="1.25rem"></val-icon>
    </div>
  }

  <div class="val-alert__content">
    @if (title()) {
      <div class="val-alert__title">
        {{ title() }}
      </div>
    }
    <div class="val-alert__message">
      <ng-content></ng-content>
    </div>
  </div>

  @if (closable()) {
    <button
      type="button"
      class="val-alert__close-button"
      (click)="close()"
      aria-label="Close alert"
    >
      <val-icon name="x" size="1.125rem"></val-icon>
    </button>
  }
</div>
