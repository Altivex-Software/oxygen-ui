<div class="val-panel__container" 
     [class.val-panel--collapsed]="collapsed()"
     role="region" 
     [attr.aria-labelledby]="headerId()">
  @if (header() || headerTemplate()) {
    <div class="val-panel__header">
      <span class="val-panel__header-content"
            [id]="headerId()"
            [class.val-panel__header-content--toggleable]="toggleable()"
            (click)="toggle()"
            (keydown.enter)="toggle()"
            (keydown.space)="toggle()"
            [attr.tabindex]="toggleable() ? 0 : null"
            [attr.role]="toggleable() ? 'button' : null"
            [attr.aria-expanded]="toggleable() ? !collapsed() : null"
            [attr.aria-controls]="toggleable() ? contentId() : null">
        
        @if (toggleable()) {
           @if (iconTemplate()) {
             <ng-container *ngTemplateOutlet="iconTemplate() || null; context: { $implicit: collapsed() }"></ng-container>
           } @else {
             <val-icon name="chevron-down" size="1rem" class="val-panel__icon" [class.val-panel__icon--collapsed]="collapsed()"></val-icon>
           }
        }
        
        @if (headerTemplate()) {
          <ng-container *ngTemplateOutlet="headerTemplate() || null; context: { $implicit: collapsed() }"></ng-container>
        } @else {
          {{ header() }}
        }
      </span>
    </div>
  }
  
  <div class="val-panel__wrapper" 
       [id]="contentId()"
       [class.val-panel__wrapper--collapsed]="collapsed()">
    <div class="val-panel__content"
         [style.max-height]="scrollable() && (scrollDirection() === 'y' || scrollDirection() === 'both') ? scrollHeight() : null"
         [style.max-width]="scrollable() && (scrollDirection() === 'x' || scrollDirection() === 'both') ? scrollWidth() : null"
         [style.overflow-y]="scrollable() && (scrollDirection() === 'y' || scrollDirection() === 'both') ? 'auto' : null"
         [style.overflow-x]="scrollable() && (scrollDirection() === 'x' || scrollDirection() === 'both') ? 'auto' : null">
      <ng-content></ng-content>
    </div>
  </div>
</div>
