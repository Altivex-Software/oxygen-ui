<div class="val-card__flipper" [class.val-card__flipper--flipped]="flipped()">
  <!-- Front Side -->
  <div class="val-card__front" 
       #frontSide
       [attr.aria-hidden]="flipped()"
       [inert]="flipped()">
    <div class="val-card__inner">
      <!-- Header Image / Content -->
      @if (header()) {
        <div class="val-card__header">
          <ng-content select="[valCardHeader]"></ng-content>
        </div>
      }

      <!-- Body Content -->
      @if (body()) {
        <div class="val-card__body">
          <ng-content select="[valCardBody]"></ng-content>
        </div>
      } @else {
        <div class="val-card__body">
          <ng-content></ng-content>
        </div>
      }

      <!-- Footer Content -->
      @if (footer()) {
        <div class="val-card__footer">
          <ng-content select="[valCardFooter]"></ng-content>
        </div>
      }
    </div>
  </div>

  <!-- Back Side -->
  @if (hasBack()) {
    <div class="val-card__back"
         #backSide
         [attr.aria-hidden]="!flipped()"
         [inert]="!flipped()">
      <div class="val-card__inner">
        @if (backHeader()) {
          <div class="val-card__header">
            <ng-content select="[valCardBackHeader]"></ng-content>
          </div>
        }

        @if (backBody()) {
          <div class="val-card__body">
            <ng-content select="[valCardBackBody]"></ng-content>
          </div>
        } @else if (back()) {
          <div class="val-card__body">
            <ng-content select="[valCardBack]"></ng-content>
          </div>
        }

        @if (backFooter()) {
          <div class="val-card__footer">
            <ng-content select="[valCardBackFooter]"></ng-content>
          </div>
        }
      </div>
    </div>
  }
</div>
