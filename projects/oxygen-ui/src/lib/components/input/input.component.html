@if (hasLabel() && !floatLabel()) {
  <label [for]="id()" class="oxy-input-label">
    {{ label() }}
    @if (required()) {
      <span class="oxy-input-required">*</span>
    }
  </label>
}

<div class="oxy-input-container">
  @if (hasLabel() && floatLabel()) {
    <label [for]="id()" class="oxy-input-label">
      {{ label() }}
      @if (required()) {
        <span class="oxy-input-required">*</span>
      }
    </label>
  }
  @if (icon() === 'search') {
    <span class="oxy-input-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
    </span>
  }
  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    class="oxy-input-field"
    [class.oxy-input-field--has-icon]="!!icon()"
    [attr.aria-describedby]="
      error() ? id() + '-error' : hint() ? id() + '-hint' : null
    "
    [attr.aria-invalid]="!!error()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</div>

@if (error()) {
  <div [id]="id() + '-error'" class="oxy-input-error" role="alert">
    {{ error() }}
  </div>
} @else if (hint()) {
  <div [id]="id() + '-hint'" class="oxy-input-hint">
    {{ hint() }}
  </div>
}
